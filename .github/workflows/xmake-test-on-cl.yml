name: Windows CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test-windows:
    runs-on: windows-latest
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    # 1. 在 Windows 上安装并启动 MySQL 服务
    - name: Setup MySQL
      uses: shogo82148/actions-setup-mysql@v1
      with:
        mysql-version: '8.0'
        auto-start: true
        root-password: 'root'

    # - name: Setup PostgreSQL
    #   shell: powershell
    #   run: |
    #     # 查找安装路径并添加到 PATH
    #     $pgPath = Get-ChildItem "C:\Program Files\PostgreSQL" | Select-Object -First 1
    #     $pgBin = "$($pgPath.FullName)\bin"
    #     echo "$pgBin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        
    #     # 启动服务 (Windows 服务名通常是 postgresql-x64-<version>)
    #     $serviceName = Get-Service | Where-Object { $_.Name -like "postgresql*" } | Select-Object -ExpandProperty Name
    #     Write-Host "Starting service: $serviceName"
    #     net start $serviceName

    #     # 等待启动
    #     Start-Sleep -Seconds 5

    # 2. 创建测试数据库
    - name: Create Database
      shell: powershell
      run: |
        # 等待服务就绪（循环检测 mysqladmin ping）
        $max=30
        $i=0
        while ($i -lt $max) {
          try {
            & mysqladmin -h 127.0.0.1 -u root -proot ping; if ($LASTEXITCODE -eq 0) { break }
          } catch {}
          Start-Sleep -Seconds 2
          $i++
        }

        # 初始管理操作通过 localhost（通常拥有 socket 特权），然后创建一个 TCP-friendly CI 用户 ci@'%'
        & mysql -h localhost -u root -proot -e "ALTER USER 'root'@'localhost' IDENTIFIED WITH mysql_native_password BY 'root'; CREATE USER IF NOT EXISTS 'ci'@'%' IDENTIFIED WITH mysql_native_password BY 'ci'; GRANT ALL PRIVILEGES ON *.* TO 'ci'@'%' WITH GRANT OPTION; FLUSH PRIVILEGES; CREATE DATABASE IF NOT EXISTS test_db;"

        # --- PostgreSQL 初始化 ---
        # 默认 postgres 用户在 Windows CI 上通常没有密码或者使用系统认证
        # 创建 ci 用户和测试数据库
        # $env:PGPASSWORD = "" # 尝试空密码登录
        # & psql -h localhost -U postgres -c "CREATE USER ci WITH PASSWORD 'ci' SUPERUSER;"
        # & psql -h localhost -U postgres -c "CREATE DATABASE test_db;"

    # 3. 安装 XMake
    - name: Setup XMake
      uses: xmake-io/github-action-setup-xmake@v1
      with:
        xmake-version: latest
        actions-cache-folder: '.xmake-cache'

    # 4. 配置构建 (使用 MSVC 编译器)
    # 这里的 -y 自动确认包安装 (如果有 add_requires 的话)
    - name: Configure XMake
      run: xmake f -p windows -a x64 -m debug -k shared --enable_test=y --enable_sqlite=sqlite --enable_mysql=y --enable_postgres=n -y

    # 5. 构建项目
    - name: Build
      run: xmake -y

    # 6. 运行测试
    # Windows 上 localhost 解析有时会有 ipv6 问题，如果连不上，代码里优先读取环境变量
    - name: Run Tests
      env:
        DB_HOST: 127.0.0.1
        DB_USER: ci
        DB_PASS: ci
        DB_NAME: test_db
        DB_PORT: 3306
        # PostgreSQL 配置
        PG_HOST: 127.0.0.1
        PG_USER: ci
        PG_PASS: ci
        PG_NAME: test_db
        PG_PORT: 5432
      run: xmake test -v