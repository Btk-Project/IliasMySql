name: Windows CI  Msvc

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test-windows:
    runs-on: windows-latest
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    # 1. 在 Windows 上安装并启动 MySQL 服务
    - name: Setup MySQL
      uses: shogo82148/actions-setup-mysql@v1
      with:
        mysql-version: '8.0'
        auto-start: true
        root-password: 'root'

    - name: Setup PostgreSQL
      shell: powershell
      run: |
        choco install postgresql15 --params '/Password:postgres' -y --no-progress

        # 查找安装路径并添加到 PATH
        $pgPath = Get-ChildItem "C:\Program Files\PostgreSQL" -Directory | Sort-Object Name -Descending | Select-Object -First 1
        if (-not $pgPath) { throw "PostgreSQL installation not found" }
        $pgBin = "$($pgPath.FullName)\bin"
        $pgIsReady = "$pgBin\pg_isready.exe"
        echo "$pgBin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

        # 启动服务 (Windows 服务名通常是 postgresql-x64-<version>)
        $service = Get-Service | Where-Object { $_.Name -like "postgresql*" } | Select-Object -First 1
        if (-not $service) { throw "PostgreSQL service not found" }
        if ($service.Status -ne "Running") { Start-Service $service.Name }

        # 等待 PostgreSQL 服务就绪
        $env:PGPASSWORD = "postgres"
        $max=30
        $i=0
        while ($i -lt $max) {
          & "$pgIsReady" -h 127.0.0.1 -p 5432 -U postgres
          if ($LASTEXITCODE -eq 0) { break }
          Start-Sleep -Seconds 2
          $i++
        }
        if ($i -ge $max) { throw "PostgreSQL did not become ready in time" }

    # 2. 创建测试数据库
    - name: Create Database
      shell: powershell
      run: |
        # 等待服务就绪（循环检测 mysqladmin ping）
        $max=30
        $i=0
        while ($i -lt $max) {
          try {
            & mysqladmin -h 127.0.0.1 -u root -proot ping; if ($LASTEXITCODE -eq 0) { break }
          } catch {}
          Start-Sleep -Seconds 2
          $i++
        }

        # 初始管理操作通过 localhost（通常拥有 socket 特权），然后创建一个 TCP-friendly CI 用户 ci@'%'
        & mysql -h localhost -u root -proot -e "ALTER USER 'root'@'localhost' IDENTIFIED WITH mysql_native_password BY 'root'; CREATE USER IF NOT EXISTS 'ci'@'%' IDENTIFIED WITH mysql_native_password BY 'ci'; GRANT ALL PRIVILEGES ON *.* TO 'ci'@'%' WITH GRANT OPTION; FLUSH PRIVILEGES; CREATE DATABASE IF NOT EXISTS test_db;"

        # --- PostgreSQL 初始化 ---
        $env:PGPASSWORD = "postgres"
        & psql -h 127.0.0.1 -p 5432 -U postgres -d postgres -v ON_ERROR_STOP=1 -c "DROP DATABASE IF EXISTS testdb;"
        & psql -h 127.0.0.1 -p 5432 -U postgres -d postgres -v ON_ERROR_STOP=1 -c "DROP ROLE IF EXISTS test;"
        & psql -h 127.0.0.1 -p 5432 -U postgres -d postgres -v ON_ERROR_STOP=1 -c "CREATE ROLE test LOGIN PASSWORD 'test';"
        & psql -h 127.0.0.1 -p 5432 -U postgres -d postgres -v ON_ERROR_STOP=1 -c "CREATE DATABASE testdb OWNER test;"

        $env:PGPASSWORD = "test"
        & psql -h 127.0.0.1 -p 5432 -U test -d testdb -v ON_ERROR_STOP=1 -f tests/postgres/init.sql

    # 3. 安装 XMake
    - name: Setup XMake
      uses: xmake-io/github-action-setup-xmake@v1
      with:
        xmake-version: latest
        actions-cache-folder: '.xmake-cache'

    # 4. 配置构建 (使用 MSVC 编译器)
    # 这里的 -y 自动确认包安装 (如果有 add_requires 的话)
    - name: Configure XMake
      run: xmake f -p windows -a x64 -m debug -k shared --enable_test=y --enable_sqlite=sqlite --enable_mysql=y --enable_postgres=y -cy

    # 5. 构建项目
    - name: Build
      run: xmake -y

    # 6. 运行测试
    # Windows 上 localhost 解析有时会有 ipv6 问题，如果连不上，代码里优先读取环境变量
    - name: Run Tests
      env:
        DB_HOST: 127.0.0.1
        DB_USER: ci
        DB_PASS: ci
        DB_NAME: test_db
        DB_PORT: 3306
        # PostgreSQL 配置
        PG_HOST: 127.0.0.1
        PG_USER: test
        PG_PASS: test
        PG_NAME: testdb
        PG_PORT: 5432
      run: xmake test -v
