name: Windows CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test-windows:
    runs-on: windows-latest
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    # 1. 在 Windows 上安装并启动 MySQL 服务
    - name: Setup MySQL
      uses: shogo82148/actions-setup-mysql@v1
      with:
        mysql-version: '8.0'
        auto-start: true
        root-password: 'root'

    # 2. 创建测试数据库
    - name: Create Database
      run: |
        Start-Sleep -Seconds 10
        
        # 1. 修改 localhost (覆盖 Socket/Pipe 连接)
        mysql -u root -proot -e "ALTER USER 'root'@'localhost' IDENTIFIED WITH mysql_native_password BY 'root';"
        
        # 2. 【关键】修改 127.0.0.1 (覆盖 TCP 连接)
        # 很多 MySQL 安装默认不包含这个条目，或者包含但配置不同，强制创建/修改它以防万一
        mysql -u root -proot -e "CREATE USER IF NOT EXISTS 'root'@'127.0.0.1' IDENTIFIED WITH mysql_native_password BY 'root';"
        mysql -u root -proot -e "ALTER USER 'root'@'127.0.0.1' IDENTIFIED WITH mysql_native_password BY 'root';"
        
        # 3. 授予权限 (防止新建的 127.0.0.1 用户没权限)
        mysql -u root -proot -e "GRANT ALL PRIVILEGES ON *.* TO 'root'@'127.0.0.1' WITH GRANT OPTION;"
        
        mysql -u root -proot -e "FLUSH PRIVILEGES;"
        mysql -u root -proot -e "CREATE DATABASE test_db;"

    # 3. 安装 XMake
    - name: Setup XMake
      uses: xmake-io/github-action-setup-xmake@v1
      with:
        xmake-version: latest
        actions-cache-folder: '.xmake-cache'

    # 4. 配置构建 (使用 MSVC 编译器)
    # 这里的 -y 自动确认包安装 (如果有 add_requires 的话)
    - name: Configure XMake
      run: xmake f -p windows -a x64 -m debug -y

    # 5. 构建项目
    - name: Build
      run: xmake -y

    # 6. 运行测试
    # Windows 上 localhost 解析有时会有 ipv6 问题，如果连不上，代码里优先读取环境变量
    - name: Run Tests
      env:
        DB_HOST: 127.0.0.1
        DB_USER: root
        DB_PASS: root
        DB_NAME: test_db
        DB_PORT: 3306
      run: xmake test -v